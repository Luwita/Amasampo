# Render Blueprint: in Render choose New → Blueprint and pick this repository.
# Settings marked `sync: false` are secrets: Render asks for them when the Blueprint is created.
services:
  - type: web
    name: zedmarket
    runtime: node
    plan: free
    # Next to the Neon database (Frankfurt), the closest region to Zambia.
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Neon's pooled connection string (host name contains -pooler), used for the app's queries.
      - key: DATABASE_URL
        sync: false
      # Neon's direct connection string (no -pooler), used to apply database updates when the server starts.
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # Owner phone numbers for the admin panel, e.g. 0977123456,0966123456
      - key: ADMIN_PHONES
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
